name: Full cross-platform quality

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    name: Full quality / ${{ matrix.id }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: linux
            os: ubuntu-24.04
          - id: macos
            os: macos-15
          - id: windows
            os: windows-2025

    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
        with:
          run_install: false
          version: 10.33.0
      - uses: actions/setup-node@v6
        with:
          cache: pnpm
          node-version: 24

      - run: pnpm install --frozen-lockfile
      - name: Install Electron binary with retry
        shell: bash
        run: |
          for attempt in 1 2 3 4; do
            if node node_modules/electron/install.js; then
              if [ "$RUNNER_OS" = "Linux" ]; then
                if test -x node_modules/electron/dist/electron; then
                  exit 0
                fi
              elif pnpm exec electron --version; then
                exit 0
              fi
            fi
            sleep $((attempt * 10))
          done
          exit 1
      - name: Rebuild patched node-pty from source
        if: runner.os == 'Windows'
        shell: bash
        env:
          npm_config_build_from_source: 'true'
        run: pnpm rebuild node-pty
      - name: Run every static and structural quality gate
        run: pnpm check:quality
      - name: Run all unit, integration, and contract tests
        run: pnpm test:core:ci
      - run: pnpm build
