name: Electron E2E

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: electron-e2e-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Electron / ${{ matrix.id }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: linux
            os: ubuntu-24.04
          - id: macos
            os: macos-15
          - id: windows
            os: windows-2025

    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
        with:
          run_install: false
          version: 10.33.0
      - uses: actions/setup-node@v6
        with:
          cache: pnpm
          node-version: 24

      - run: pnpm install --frozen-lockfile
      - name: Install Electron binary with retry
        shell: bash
        run: |
          for attempt in 1 2 3 4; do
            if node node_modules/electron/install.js; then
              if [ "$RUNNER_OS" = "Linux" ]; then
                if test -x node_modules/electron/dist/electron; then
                  exit 0
                fi
              elif pnpm exec electron --version; then
                exit 0
              fi
            fi
            sleep $((attempt * 10))
          done
          exit 1
      - run: pnpm exec electron-vite build
      - name: Restore prepared Windows node-pty cache
        id: windows-node-pty-cache
        if: runner.os == 'Windows'
        uses: actions/cache@v5
        with:
          path: .cache/windows-node-pty-electron
          key: windows-node-pty-electron-${{ runner.arch }}-${{ hashFiles('pnpm-lock.yaml', 'patches/**', 'electron-builder.yml', 'scripts/prepare-native-dependencies.mjs', 'scripts/prepare-packaging.mjs', 'scripts/verify-node-pty-native.mjs', 'scripts/windows-node-pty-native-artifact.mjs') }}
      - name: Rebuild patched node-pty for Electron
        if: runner.os == 'Windows' && steps.windows-node-pty-cache.outputs.cache-hit != 'true'
        run: pnpm prepare:native
      - name: Export prepared Windows node-pty artifact
        if: runner.os == 'Windows' && steps.windows-node-pty-cache.outputs.cache-hit != 'true'
        run: pnpm native:artifact:export
      - name: Restore cached Windows node-pty artifact
        if: runner.os == 'Windows' && steps.windows-node-pty-cache.outputs.cache-hit == 'true'
        run: pnpm native:artifact:restore
      - name: Verify prepared Windows node-pty artifact
        if: runner.os == 'Windows'
        run: pnpm verify:native
      - name: Package Electron binary
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "macOS" ]; then
            ditto -c -k --sequesterRsrc --keepParent \
              node_modules/electron/dist electron-e2e-runtime-${{ matrix.id }}.zip
            cp node_modules/electron/path.txt electron-e2e-path-${{ matrix.id }}.txt
          else
            tar -czf electron-e2e-runtime-${{ matrix.id }}.tgz \
              -C node_modules/electron \
              dist \
              path.txt
          fi
      - uses: actions/upload-artifact@v7
        with:
          if-no-files-found: error
          name: electron-e2e-application-${{ matrix.id }}
          path: |
            out
            electron-e2e-runtime-${{ matrix.id }}.*
            electron-e2e-path-${{ matrix.id }}.txt
          retention-days: 1
      - name: Upload prepared Windows node-pty artifact
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v7
        with:
          if-no-files-found: error
          name: electron-e2e-native-windows
          path: .cache/windows-node-pty-electron
          retention-days: 1

  packaged_windows:
    name: Packaged Windows smoke
    needs: build
    runs-on: windows-2025
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
        with:
          run_install: false
          version: 10.33.0
      - uses: actions/setup-node@v6
        with:
          cache: pnpm
          node-version: 24

      - name: Install dependencies without downloading Electron again
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
        run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v8
        with:
          name: electron-e2e-application-windows
          path: .
      - uses: actions/download-artifact@v8
        with:
          name: electron-e2e-native-windows
          path: .cache/windows-node-pty-electron
      - name: Restore prebuilt Electron binary
        shell: bash
        run: |
          electron_package_directory=$(cd node_modules/electron && pwd -P)
          tar -C "$electron_package_directory" \
            -xzf electron-e2e-runtime-windows.tgz
          rm electron-e2e-runtime-windows.tgz
          pnpm exec electron --version
      - name: Restore prepared Windows node-pty artifact
        run: pnpm native:artifact:restore
      - name: Verify prepared Windows node-pty artifact
        run: pnpm verify:native
      - name: Package Windows application without rebuilding native dependencies
        shell: bash
        run: |
          pnpm prepare:packaging
          pnpm exec electron-builder --dir --win --x64 --publish never \
            --config.npmRebuild=false
      - name: Resolve packaged Windows executable
        shell: bash
        run: |
          packaged_relative_path=$(find release \
            -path '*unpacked/CleanCode.exe' \
            -type f -print -quit)

          if [ -z "$packaged_relative_path" ]; then
            echo "Packaged Windows executable was not found." >&2
            exit 1
          fi

          packaged_executable_path=$(node -e \
            "process.stdout.write(require('node:path').resolve(process.argv[1]))" \
            "$packaged_relative_path")
          echo "CLEANCODE_E2E_EXECUTABLE_PATH=$packaged_executable_path" >> "$GITHUB_ENV"
      - name: Run packaged Windows terminal smoke test
        shell: bash
        env:
          CLEANCODE_E2E_PREBUILT: '1'
          DEBUG: 'pw:browser*'
        run: |
          pnpm test:e2e tests/e2e/run-terminal-sessions.e2e.spec.ts \
            -t "runs shell commands from the active project workspace"
      - name: Prepare packaged Windows install replacement fixture
        shell: bash
        run: |
          node -e '
            const { appendFileSync, cpSync } = require("node:fs")
            const { basename, dirname, join } = require("node:path")
            const replacement = process.env.CLEANCODE_E2E_EXECUTABLE_PATH
            const fixture = join(
              process.env.RUNNER_TEMP,
              `cleancode-e2e-old-${process.env.GITHUB_RUN_ID}-${process.env.GITHUB_RUN_ATTEMPT}`
            )
            cpSync(dirname(replacement), fixture, { recursive: true })
            appendFileSync(
              process.env.GITHUB_ENV,
              `CLEANCODE_E2E_REPLACEMENT_EXECUTABLE_PATH=${replacement}\n` +
                `CLEANCODE_E2E_EXECUTABLE_PATH=${join(fixture, basename(replacement))}\n`
            )
          '
      - name: Run packaged Windows Provider install-replacement smoke test
        shell: bash
        env:
          CLEANCODE_E2E_PREBUILT: '1'
          DEBUG: 'pw:browser*'
        run: |
          pnpm test:e2e tests/e2e/terminal-runtime-recovery.e2e.spec.ts \
            -t "warm-attaches the same retained PTY after a normal application restart"
      - name: Upload packaged Windows smoke diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          if-no-files-found: ignore
          name: electron-e2e-packaged-diagnostics-windows
          path: test-results/e2e
          retention-days: 7

  e2e:
    name: Electron E2E / ${{ matrix.id }} / shard ${{ matrix.shard }}
    needs: build
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: linux
            os: ubuntu-24.04
            shard: 1
          - id: macos
            os: macos-15
            shard: 1
          - id: windows
            os: windows-2025
            shard: 1
          - id: linux
            os: ubuntu-24.04
            shard: 2
          - id: macos
            os: macos-15
            shard: 2
          - id: windows
            os: windows-2025
            shard: 2
          - id: linux
            os: ubuntu-24.04
            shard: 3
          - id: macos
            os: macos-15
            shard: 3
          - id: windows
            os: windows-2025
            shard: 3

    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
        with:
          run_install: false
          version: 10.33.0
      - uses: actions/setup-node@v6
        with:
          cache: pnpm
          node-version: 24

      - name: Install dependencies without downloading Electron again
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
        run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v8
        with:
          name: electron-e2e-application-${{ matrix.id }}
          path: .
      - uses: actions/download-artifact@v8
        if: runner.os == 'Windows'
        with:
          name: electron-e2e-native-windows
          path: .cache/windows-node-pty-electron
      - name: Restore prebuilt Electron binary
        shell: bash
        run: |
          electron_package_directory=$(cd node_modules/electron && pwd -P)
          if [ "$RUNNER_OS" = "macOS" ]; then
            ditto -x -k \
              electron-e2e-runtime-${{ matrix.id }}.zip "$electron_package_directory"
            cp electron-e2e-path-${{ matrix.id }}.txt "$electron_package_directory/path.txt"
            rm electron-e2e-runtime-${{ matrix.id }}.zip
            rm electron-e2e-path-${{ matrix.id }}.txt
            pnpm exec electron --version
          else
            tar -C "$electron_package_directory" \
              -xzf electron-e2e-runtime-${{ matrix.id }}.tgz
            rm electron-e2e-runtime-${{ matrix.id }}.tgz
          fi
          if [ "$RUNNER_OS" = "Linux" ]; then
            test -x node_modules/electron/dist/electron
          elif [ "$RUNNER_OS" = "Windows" ]; then
            pnpm exec electron --version
          fi
      - name: Restore prepared Windows node-pty artifact
        if: runner.os == 'Windows'
        run: pnpm native:artifact:restore
      - name: Verify prepared Windows node-pty artifact
        if: runner.os == 'Windows'
        run: pnpm verify:native
      - name: Run E2E shard on Linux
        if: runner.os == 'Linux'
        env:
          CLEANCODE_E2E_PREBUILT: '1'
        run: xvfb-run --auto-servernum pnpm test:e2e --shard=${{ matrix.shard }}/3
      - name: Run E2E shard
        if: runner.os != 'Linux'
        env:
          CLEANCODE_E2E_PREBUILT: '1'
        run: pnpm test:e2e --shard=${{ matrix.shard }}/3

      - name: Upload E2E diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          if-no-files-found: ignore
          name: electron-e2e-diagnostics-${{ matrix.id }}-${{ matrix.shard }}
          path: test-results/e2e
          retention-days: 7
