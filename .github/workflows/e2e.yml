name: Electron E2E

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: electron-e2e-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Electron / ${{ matrix.id }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: linux
            os: ubuntu-24.04
          - id: macos
            os: macos-15
          - id: windows
            os: windows-2025

    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
        with:
          run_install: false
          version: 10.33.0
      - uses: actions/setup-node@v6
        with:
          cache: pnpm
          node-version: 24

      - run: pnpm install --frozen-lockfile
      - name: Install Electron binary with retry
        shell: bash
        run: |
          for attempt in 1 2 3 4; do
            if node node_modules/electron/install.js; then
              if [ "$RUNNER_OS" = "Linux" ]; then
                if test -x node_modules/electron/dist/electron; then
                  exit 0
                fi
              elif pnpm exec electron --version; then
                exit 0
              fi
            fi
            sleep $((attempt * 10))
          done
          exit 1
      - run: pnpm exec electron-vite build
      - name: Package Electron binary
        shell: bash
        run: >-
          tar -czf electron-e2e-runtime-${{ matrix.id }}.tgz
          node_modules/electron/dist
          node_modules/electron/path.txt
      - uses: actions/upload-artifact@v7
        with:
          if-no-files-found: error
          name: electron-e2e-application-${{ matrix.id }}
          path: |
            out
            electron-e2e-runtime-${{ matrix.id }}.tgz
          retention-days: 1

  e2e:
    name: Electron E2E / ${{ matrix.id }} / shard ${{ matrix.shard }}
    needs: build
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: linux
            os: ubuntu-24.04
            shard: 1
          - id: macos
            os: macos-15
            shard: 1
          - id: windows
            os: windows-2025
            shard: 1
          - id: linux
            os: ubuntu-24.04
            shard: 2
          - id: macos
            os: macos-15
            shard: 2
          - id: windows
            os: windows-2025
            shard: 2
          - id: linux
            os: ubuntu-24.04
            shard: 3
          - id: macos
            os: macos-15
            shard: 3
          - id: windows
            os: windows-2025
            shard: 3

    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
        with:
          run_install: false
          version: 10.33.0
      - uses: actions/setup-node@v6
        with:
          cache: pnpm
          node-version: 24

      - name: Install dependencies without downloading Electron again
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
        run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v8
        with:
          name: electron-e2e-application-${{ matrix.id }}
          path: .
      - name: Restore prebuilt Electron binary
        shell: bash
        run: |
          tar -xzf electron-e2e-runtime-${{ matrix.id }}.tgz
          rm electron-e2e-runtime-${{ matrix.id }}.tgz
          if [ "$RUNNER_OS" = "Linux" ]; then
            test -x node_modules/electron/dist/electron
          else
            pnpm exec electron --version
          fi
      - name: Run E2E shard on Linux
        if: runner.os == 'Linux'
        env:
          CLEANCODE_E2E_PREBUILT: '1'
        run: xvfb-run --auto-servernum pnpm test:e2e --shard=${{ matrix.shard }}/3
      - name: Run E2E shard
        if: runner.os != 'Linux'
        env:
          CLEANCODE_E2E_PREBUILT: '1'
        run: pnpm test:e2e --shard=${{ matrix.shard }}/3

      - name: Upload E2E diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          if-no-files-found: ignore
          name: electron-e2e-diagnostics-${{ matrix.id }}-${{ matrix.shard }}
          path: test-results/e2e
          retention-days: 7
