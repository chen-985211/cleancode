name: Electron E2E

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: electron-e2e-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  platform:
    name: Electron / ${{ matrix.id }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: linux
            os: ubuntu-24.04
          - id: macos
            os: macos-15
          - id: windows
            os: windows-2025
    uses: ./.github/workflows/e2e-platform.yml
    with:
      platform_id: ${{ matrix.id }}
      runner: ${{ matrix.os }}
