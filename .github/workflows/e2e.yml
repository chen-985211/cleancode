name: Electron E2E

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: electron-e2e-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Electron / ${{ matrix.id }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: linux
            os: ubuntu-24.04
          - id: macos
            os: macos-15
          - id: windows
            os: windows-2025

    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
        with:
          run_install: false
          version: 10.33.0
      - uses: actions/setup-node@v6
        with:
          cache: pnpm
          node-version: 24

      - run: pnpm install --frozen-lockfile
      - run: pnpm exec electron-vite build
      - uses: actions/upload-artifact@v7
        with:
          if-no-files-found: error
          name: electron-e2e-application-${{ matrix.id }}
          path: out
          retention-days: 1

  e2e:
    name: Electron E2E / ${{ matrix.id }} / shard ${{ matrix.shard }}
    needs: build
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: linux
            os: ubuntu-24.04
            shard: 1
          - id: macos
            os: macos-15
            shard: 1
          - id: windows
            os: windows-2025
            shard: 1
          - id: linux
            os: ubuntu-24.04
            shard: 2
          - id: macos
            os: macos-15
            shard: 2
          - id: windows
            os: windows-2025
            shard: 2
          - id: linux
            os: ubuntu-24.04
            shard: 3
          - id: macos
            os: macos-15
            shard: 3
          - id: windows
            os: windows-2025
            shard: 3

    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
        with:
          run_install: false
          version: 10.33.0
      - uses: actions/setup-node@v6
        with:
          cache: pnpm
          node-version: 24

      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v8
        with:
          name: electron-e2e-application-${{ matrix.id }}
          path: out
      - name: Run E2E shard on Linux
        if: runner.os == 'Linux'
        env:
          CLEANCODE_E2E_PREBUILT: '1'
        run: xvfb-run --auto-servernum pnpm test:e2e --shard=${{ matrix.shard }}/3
      - name: Run E2E shard
        if: runner.os != 'Linux'
        env:
          CLEANCODE_E2E_PREBUILT: '1'
        run: pnpm test:e2e --shard=${{ matrix.shard }}/3

      - name: Upload E2E diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          if-no-files-found: ignore
          name: electron-e2e-diagnostics-${{ matrix.id }}-${{ matrix.shard }}
          path: test-results/e2e
          retention-days: 7
